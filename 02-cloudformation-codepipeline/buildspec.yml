version: 0.2

env:
  variables:
    STACKS_GLOB: 02-cloudformation-codepipeline/stacks/*.yaml
    PIPELINE_TEMPLATE: 02-cloudformation-codepipeline/templates/pipeline.yml
    TASKCAT_CONFIG: 02-cloudformation-codepipeline/.taskcat.yml

phases:
  install:
    commands:
      - python3 --version
      - python3 -m pip install --upgrade pip
      - python3 -m pip install "setuptools==69.5.1" wheel
      - python3 -m pip install cfn-lint taskcat
      - python3 -m pip install "setuptools==69.5.1"
      - python3 -c "import pkg_resources; print('pkg_resources is available')"
  pre_build:
    commands:
      - cfn-lint -i W3005 -- $STACKS_GLOB "$PIPELINE_TEMPLATE"
  build:
    commands:
      - taskcat lint -i "$TASKCAT_CONFIG" -p .
  post_build:
    commands:
      - echo "CloudFormation validation commands completed."
