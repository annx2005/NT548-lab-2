AWSTemplateFormatVersion: "2010-09-09"
Description: "NT548 Lab 1 - Security groups for public and private EC2 instances."

Parameters:
  VpcStackName:
    Type: String
    Default: nt548-lab1-vpc
    Description: Name of the VPC stack that exports the VPC ID.

  MyIpCidr:
    Type: String
    Description: Your public IP in CIDR format, for example 1.2.3.4/32.
    AllowedPattern: ^([0-9]{1,3}\.){3}[0-9]{1,3}/([0-9]|[1-2][0-9]|3[0-2])$

Resources:
  PublicEc2SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: nt548-lab1-public-ec2-sg
      GroupDescription: Allow SSH only from my IP
      VpcId:
        Fn::ImportValue: !Sub "${VpcStackName}-VpcId"
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref MyIpCidr
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: nt548-lab1-public-ec2-sg

  PrivateEc2SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: nt548-lab1-private-ec2-sg
      GroupDescription: Allow SSH only from public EC2 security group
      VpcId:
        Fn::ImportValue: !Sub "${VpcStackName}-VpcId"
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          SourceSecurityGroupId: !Ref PublicEc2SecurityGroup
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: nt548-lab1-private-ec2-sg

Outputs:
  PublicEc2SecurityGroupId:
    Description: Public EC2 security group ID.
    Value: !Ref PublicEc2SecurityGroup
    Export:
      Name: !Sub "${AWS::StackName}-PublicEc2SecurityGroupId"

  PrivateEc2SecurityGroupId:
    Description: Private EC2 security group ID.
    Value: !Ref PrivateEc2SecurityGroup
    Export:
      Name: !Sub "${AWS::StackName}-PrivateEc2SecurityGroupId"
