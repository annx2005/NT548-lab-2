name: Requirement 1 - Terraform and Checkov

on:
  push:
    branches:
      - main
    paths:
      - "01-terraform-github-actions-checkov/**"
      - ".github/workflows/requirement-1-terraform.yml"
  pull_request:
    paths:
      - "01-terraform-github-actions-checkov/**"
      - ".github/workflows/requirement-1-terraform.yml"

permissions:
  contents: read
  id-token: write

env:
  BOOTSTRAP_WORKING_DIR: 01-terraform-github-actions-checkov/bootstrap-github-oidc
  TF_WORKING_DIR: 01-terraform-github-actions-checkov/terraform
  CHECKOV_CONFIG: 01-terraform-github-actions-checkov/.checkov.yml
  AWS_REGION: ap-southeast-1
  TF_IN_AUTOMATION: true

jobs:
  validate:
    name: Terraform validate and Checkov
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Bootstrap Terraform fmt
        run: terraform -chdir="$BOOTSTRAP_WORKING_DIR" fmt -check -recursive

      - name: Bootstrap Terraform init
        run: terraform -chdir="$BOOTSTRAP_WORKING_DIR" init -backend=false

      - name: Bootstrap Terraform validate
        run: terraform -chdir="$BOOTSTRAP_WORKING_DIR" validate

      - name: Terraform fmt
        run: terraform -chdir="$TF_WORKING_DIR" fmt -check -recursive

      - name: Terraform init without backend
        run: terraform -chdir="$TF_WORKING_DIR" init -backend=false

      - name: Terraform validate
        run: terraform -chdir="$TF_WORKING_DIR" validate

      - name: Install Checkov
        run: python -m pip install --upgrade checkov

      - name: Run Checkov
        run: checkov -d "$TF_WORKING_DIR" --config-file "$CHECKOV_CONFIG"

  deploy:
    name: Terraform auto deploy
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    env:
      TF_VAR_my_ip_cidr: ${{ secrets.MY_IP_CIDR }}
      TF_VAR_key_name: ${{ secrets.EC2_KEY_NAME }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check required deployment secrets
        run: |
          test -n "$TF_VAR_my_ip_cidr"
          test -n "$TF_VAR_key_name"
          test -n "${{ secrets.TF_STATE_BUCKET }}"

      - name: Terraform init with S3 backend
        run: |
          terraform -chdir="$TF_WORKING_DIR" init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="region=$AWS_REGION"

      - name: Terraform plan and apply
        run: |
          terraform -chdir="$TF_WORKING_DIR" plan -out=tfplan
          terraform -chdir="$TF_WORKING_DIR" apply -auto-approve tfplan
